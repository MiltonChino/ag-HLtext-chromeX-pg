<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>PDF Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #525659;
            font-family: sans-serif;
        }

        #viewer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page {
            position: relative;
            margin: 10px auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            background-color: white;
        }

        .textLayer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 0.2;
            line-height: 1.0;
        }

        .textLayer>span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }

        /* Highlight styles */
        .highlight {
            background-color: rgba(255, 215, 0, 0.5);
            /* Gold with opacity */
            position: absolute;
            z-index: 1;
            /* Behind text layer but above canvas */
        }
    </style>
    <script src="lib/pdfjs/pdf.min.js"></script>
    <script src="viewer.js" type="module"></script>
    <script src="pdf_content.js" defer></script>
</head>

<body>
    <div id="viewer-container">
        <div id="viewer"></div>
    </div>
</body>

</html>
