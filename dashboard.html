<!DOCTYPE html>
<html>

<head>
  <title>Highlights Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>Highlights Dashboard</h1>
      <p>Manage your saved highlights across the web</p>
      <button id="export-btn" class="export-btn">Export</button>
      <button id="import-btn" class="import-btn">Import</button>
      <input type="file" id="import-file" style="display: none" accept=".json">
    </header>

    <div id="domains-list" class="domains-list">
      <!-- Domains will be injected here -->
    </div>
  </div>
  <script src="dashboard.js"></script>
</body>

</html>
